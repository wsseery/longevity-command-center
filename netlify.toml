# PURPOSE: Send the old *.netlify.app host to the custom domain so the two do not
#          compete for the same content in search.
# TRIGGER: Every Netlify deploy of this repo.
# OUTPUT:  301 from longevity-command-center.netlify.app/* -> longevitycommandcenter.com/*
#
# Added 2026-08-30. Setting longevitycommandcenter.com as Netlify's primary domain did
# NOT produce this redirect on its own — the netlify.app host kept returning 200, so both
# hosts served identical pages. force = true is required because the netlify.app URLs
# resolve to real files; without it Netlify serves the file and ignores the rule.

[[redirects]]
  from = "https://longevity-command-center.netlify.app/*"
  to = "https://longevitycommandcenter.com/:splat"
  status = 301
  force = true

# PURPOSE: Do not serve repo-internal files on the public site.
# TRIGGER: Every Netlify deploy of this repo.
# OUTPUT:  404 for the paths below; the files stay in the repo.
#
# Added 2026-10-05. Netlify publishes the repo root, so /CLAUDE.md was served
# with HTTP 200, and it names Bill's FL licences, which this site must never
# show. No page links to any of these. force = true for the same reason as
# above: the files exist, and without it Netlify serves them.

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/build_news.py"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tools/histamine-kitchen/README.md"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/tools/histamine-kitchen/build/*"
  to = "/404"
  status = 404
  force = true

# PURPOSE: One URL per page. Clean URLs (/news, /blog-...) are canonical; the .html form
#          301s to them so search engines stop indexing both.
# TRIGGER: Every Netlify deploy of this repo.
# OUTPUT:  301 from /<page>.html -> /<page>. /index.html is left alone: no link uses it, and a
#          forced rule on the file that answers / is not worth the risk to the homepage.
#
# Added 2026-10-20 (SEO audit 2026-10-14, P1 #6). Netlify already serves /news from
# news.html, so both forms returned 200 and Search Console counted the clean form as an
# alternate of the .html canonical. Canonicals, og:url, sitemap.xml and every internal link
# now use the clean form. force = true for the same reason as above: the .html files exist.
# One rule per page because Netlify placeholders match whole path segments only.
# A new page needs a rule here, a clean canonical and a clean sitemap entry.

[[redirects]]
  from = "/compounds.html"
  to = "/compounds"
  status = 301
  force = true

[[redirects]]
  from = "/finance.html"
  to = "/finance"
  status = 301
  force = true

[[redirects]]
  from = "/news.html"
  to = "/news"
  status = 301
  force = true

[[redirects]]
